<!--
Versafy — шаблон карточки изменений. Эталон к «Versafy — регламент ИИ-ассистента», раздел 3 (версия 2.5).
Хранится в репозитории DiamondeX/versafy-assistant; изменения вносятся только через pull request (см. README).
Словесное описание карточки — Google Doc «Описание карточки изменений для использования ИИ-ассистентом в чатах»
(https://docs.google.com/document/d/1zNn8f3B0WeJ4fmjxR5ZI1pMviZTWF2PfKbyk50bEJGs/edit). Его читают, только если
этот файл недоступен; при изменении устройства или поведения карточки он обновляется вместе с эталоном.

КАК ИСПОЛЬЗОВАТЬ
1. Карточка выводится инструментом show_widget (Visualizer). Перед первым вызовом в чате — read_me с модулем interactive.
2. В widget_code передаётся всё, что ниже этого комментария, без самого комментария.
3. Менять можно ТОЛЬКО три константы в начале <script>:
   TITLE — первая строка собранного текста, например «Решения по карточке (лист 2, строки 3–4):».
   R — блоки значений. Поля каждого блока значения:
       o — объект с номером, как в регламенте: «Rebin Said, SolarCentric #278»;
       u — ссылка на объект (Planfix, Google Doc, календарь);
       f — поле или действие: «Лид-форма», «Новый комментарий», «Новое задание: разбор встречи»;
       w — было («—», если пусто);
       n — станет (переносы строк — \n);
       s — источник;
       d — необязательно: true, если блок значения содержит черновик сообщения. Тогда у части «Станет» выводится
       иконка «Копировать», а после «Изменить» и у части «Изменено на»;
       opts, one — необязательно, как у блоков вопросов M: для полей со списком значений (статус, причина закрытия,
       статус тенанта, исполнители) варианты показываются над полем редактирования при нажатии «Изменить».
   M — блоки вопросов раздела «Не хватает»: q — текст вопроса обычным текстом (весь вопрос ссылкой не делается);
       l — массив ссылок [{t,u}]: t — точный фрагмент текста q (например «Kamlesh Khatiwala #92»),
       u — ссылка на этот объект. Каждый упомянутый объект — отдельная ссылка; каждое вхождение t в q
       выводится ссылкой. Если фрагменты начинаются в одном месте, берётся более длинный.
       Без упоминаний объектов l не указывается.
       opts — необязательный массив коротких вариантов ответа, если вопрос подразумевает очевидные варианты
       (например ['Да','Нет'] или список статусов). Без очевидных вариантов opts не указывается.
       До 6 вариантов выводятся кнопками, больше 6 — выпадающим списком с поиском по фрагменту.
       Нажатие варианта дописывает его в поле ответа через «; », повторное нажатие убирает его.
       one — true, если ответ может быть только один (статус, причина закрытия): нажатие заменяет ответ.
       Варианты для полей со списком значений в Planfix берутся из актуального списка Planfix.
       Ответ в поле можно дописать или изменить вручную.
       Пустой массив M — раздел покажет «Вопросов нет».
4. Стили, разметку, кнопки, цвета отметок и функцию collect() не менять.
5. Формат собранного текста (кнопки «Скопировать» и «Отправить»):
   TITLE
   N. объект · поле: принято | изменено → «значение» | обсудить: контекст | отложено | отменено | без решения
   Не хватает:
   — вопрос → ответ | отложено | отложено (черновик: текст) | отменено | без решения | без решения (черновик: текст)
   «ответ» — у вопроса нажата «Принять». У вопроса с «Отложить» введённый текст передаётся как черновик.
   Блок значения или блок вопроса без нажатой кнопки решения не имеет. Пока такие есть, «Отправить» не срабатывает,
   а «Скопировать» копирует текст с пометками «без решения»; обе кнопки выводят сообщение с числом блоков без решения
   и кнопкой «Показать», которая прокручивает карточку к первому такому блоку. После копирования под кнопкой
   «Скопировать» на 2 секунды появляется «Данные скопированы».
6. У блоков вопросов кнопки «Принять», «Отложить», «Отменить». Отметка меняется только нажатием другой кнопки;
   «Принять» без ответа не срабатывает.
7. Текст, сохранённый по «Изменить» или «Обсудить», выводится под частями «Было» и «Станет» («Изменено на»,
   «Контекст для обсуждения»); «Станет» хранит исходное предложение. После «Изменить» кнопка «Принять» принимает
   исходное «Станет». Текст, введённый в поле «Изменить» или «Обсудить», сохраняется и при выборе другого действия
   и восстанавливается при повторном выборе того же действия. В собранный текст он попадает, только если сохранён
   кнопкой «Сохранить» и итоговое решение по блоку — то же действие. Нажатие «Изменить» или «Обсудить» сбрасывает
   решение по блоку и его цветовую отметку; пока не нажата «Сохранить», поле ввода подсвечено цветом режима
   (синим у «Изменить», жёлто-коричневым у «Обсудить»). Под полем справа кнопки-иконки с подсказками: «Отменить ввод»
   (крестик) закрывает поле, блок остаётся без решения, черновик сохраняется; «Сохранить» (галочка). Пока поле
   открыто, кнопки решений этого блока неактивны (атрибут disabled). В поле Enter равносилен «Сохранить»,
   Escape — «Отменить ввод»; перенос строки — Shift+Enter.
8. У каждого блока стрелки вверх и вниз переводят к предыдущему или следующему блоку без решения; подсказка
   выводится над стрелкой. Если решения приняты по всем блокам, стрелки прокручивают к кнопкам «Скопировать»
   и «Отправить», под которыми выводится «Решения по всем блокам приняты».
-->
<h2 class="sr-only">Карточка предлагаемых изменений</h2>
<style>
.cc-row{border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 10px;background:var(--surface-2)}
.cc-row.s-acc{border-left:4px solid var(--border-success);border-radius:0 12px 12px 0}.cc-row.s-edit{border-left:4px solid var(--border-accent);border-radius:0 12px 12px 0}.cc-row.s-disc{border-left:4px solid var(--border-warning);border-radius:0 12px 12px 0}.cc-row.s-post{border-left:4px solid var(--border-strong);border-radius:0 12px 12px 0}.cc-row.s-canc{border-left:4px solid var(--border-danger);border-radius:0 12px 12px 0}.cc-row.s-macc{border-left:4px solid #1d9e8f;border-left-color:color-mix(in srgb,var(--border-accent),var(--border-success));border-radius:0 12px 12px 0}
.cc-lbl{font-size:12px;color:var(--text-secondary);margin:6px 0 2px}
.cc-val{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.cc-val.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cc-vs{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.cc-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cc-cp{min-height:32px;min-width:32px;padding:0 8px;font-size:16px;flex:0 0 auto}
.cc-usr{margin-top:8px;padding-top:4px;border-top:0.5px solid var(--border)}
.cc-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.cc-btns button{min-height:40px;flex:1 1 30%;font-size:13px}
.cc-tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:var(--radius);margin-left:6px}
.cc-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cc-opts button{min-height:36px;font-size:13px}.cc-opts button[aria-pressed="true"],.cc-ddl button[aria-pressed="true"]{border-color:var(--border-accent);background:var(--bg-accent);color:var(--text-accent)}
.cc-dd{margin-top:8px}.cc-dd input{width:100%;box-sizing:border-box;min-height:40px}
.cc-ddl{max-height:220px;overflow-y:auto;border:0.5px solid var(--border);border-radius:var(--radius);margin-top:4px;background:var(--surface-1)}
.cc-ddl button{display:block;width:100%;text-align:left;min-height:40px;font-size:13px;border:0;border-bottom:0.5px solid var(--border);border-radius:0;background:transparent}
.cc-ddl .cc-none{padding:10px 12px;font-size:13px;color:var(--text-secondary)}
.cc-nav{display:flex;gap:4px;flex:0 0 auto}.cc-nav button{position:relative;min-height:28px;min-width:28px;padding:0 6px;font-size:14px}
.cc-nav button::after,.cc-ib::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);right:0;white-space:nowrap;font-size:12px;padding:4px 8px;border-radius:var(--radius);background:var(--surface-popover,var(--surface-2));color:var(--text-primary);border:0.5px solid var(--border-strong);opacity:0;pointer-events:none;transition:opacity .15s;z-index:2}
.cc-nav button:hover::after,.cc-nav button:focus-visible::after,.cc-nav button.tip-on::after,.cc-ib:hover::after,.cc-ib:focus-visible::after{opacity:1}
.cc-eb{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}.cc-ib{position:relative;min-height:36px;min-width:36px;padding:0 8px;font-size:18px}
.cc-btns button:disabled{opacity:.4;pointer-events:none;transform:none}
.cc-ta-edit{background:var(--bg-accent);border:1px solid var(--text-accent)!important}.cc-ta-disc{background:var(--bg-warning);border:1px solid var(--text-warning)!important}
.cc-flash{outline:2px solid var(--text-accent);outline-offset:2px}
.cc-cpw{display:flex;flex-direction:column;flex:1 1 30%}.cc-cpw button{flex:0 0 auto;width:100%}#cpMsg{font-size:12px;margin-top:4px}
@media (min-width:560px){.cc-vs{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.cc-btns button,.cc-cpw{flex:0 0 auto}}
</style>
<div id="rows" style="padding:2rem 0 0.5rem"></div>
<div style="font-size:16px;font-weight:500;margin:1rem 0 8px">Не хватает</div>
<div id="miss"></div>
<div class="cc-btns" id="fin" style="margin-top:14px"><div class="cc-cpw"><button id="copyBtn"><i class="ti ti-copy" aria-hidden="true"></i> Скопировать</button><div id="cpMsg" role="status"></div></div><button id="sendBtn">Отправить ↗</button></div>
<div id="note" style="font-size:13px;color:var(--text-secondary);margin-top:6px"></div>
<script>
const TITLE='Решения по карточке (описание набора изменений):';
const R=[
{o:'Название сделки #000',u:'https://versafy.planfix.ua/task/000',f:'Поле',w:'—',n:'Новое значение',s:'Источник'}
];
const M=[
{q:'Название сделки #000: вопрос о Контакт #000?',l:[{t:'Название сделки #000',u:'https://versafy.planfix.ua/task/000'},{t:'Контакт #000',u:'https://versafy.planfix.ua/contact/000'}],opts:['Вариант 1','Вариант 2'],one:true}
];
const ST={acc:['принято','var(--bg-success)','var(--text-success)'],edit:['изменено','var(--bg-accent)','var(--text-accent)'],disc:['обсудить','var(--bg-warning)','var(--text-warning)'],post:['отложено','var(--surface-1)','var(--text-secondary)'],canc:['отменено','var(--bg-danger)','var(--text-danger)']};
const state=R.map(()=>({a:null,e:'',c:'',dr:{},o:null}));
const ms=M.map(()=>({st:null}));
const MT={acc:['принято','color-mix(in srgb,var(--bg-accent),var(--bg-success))','color-mix(in srgb,var(--text-accent),var(--text-success))'],post:['отложено','var(--surface-1)','var(--text-secondary)'],canc:['отменено','var(--bg-danger)','var(--text-danger)']};const keep={};M.forEach((_,i)=>keep[i]='');
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const navHTML=k=>`<div class="cc-nav">${[[-1,'up','предыдущему'],[1,'down','следующему']].map(([d,ic,w])=>`<button data-nav="${d}" data-from="${k}" data-tip="К ${w} блоку без решения" aria-label="К ${w} блоку без решения"><i class="ti ti-chevron-${ic}" aria-hidden="true"></i></button>`).join('')}</div>`;
const cpBtn=k=>`<button class="cc-cp" data-cp="${k}" aria-label="Копировать"><i class="ti ti-copy" aria-hidden="true"></i></button>`;
function rowHTML(r,i){const s=state[i];const t=s.a?`<span class="cc-tag" style="background:${ST[s.a][1]};color:${ST[s.a][2]}">${ST[s.a][0]}</span>`:'';
const ex=s.a==='edit'?['Изменено на',s.e]:s.a==='disc'?['Контекст для обсуждения',s.c]:null;
return `<div class="cc-row ${s.a?'s-'+s.a:''}" data-blk="r${i}"><div class="cc-hd"><div style="font-size:13px"><a href="${r.u}">${esc(r.o)}</a>${t}</div>${navHTML('r'+i)}</div>
<div style="font-size:15px;font-weight:500;margin-top:4px">${esc(r.f)}</div>
<div class="cc-vs"><div><div class="cc-lbl">Было</div><div class="cc-val">${esc(r.w)}</div></div>
<div><div class="cc-hd"><div class="cc-lbl">Станет</div>${r.d?cpBtn('n'+i):''}</div><div class="cc-val clamp" id="v${i}">${esc(r.n)}</div>${r.n.length>120?`<button style="min-height:32px;font-size:12px;margin-top:4px" data-more="${i}">Показать полностью</button>`:''}</div></div>
${ex?`<div class="cc-usr"><div class="cc-hd"><div class="cc-lbl">${ex[0]}</div>${r.d&&s.a==='edit'?cpBtn('e'+i):''}</div><div class="cc-val">${esc(ex[1])}</div></div>`:''}
<div class="cc-lbl">Источник: ${esc(r.s)}</div><div id="ed${i}">${s.o?edHTML(i):''}</div>
<div class="cc-btns">${[['acc','Принять'],['edit','Изменить'],['disc','Обсудить'],['post','Отложить'],['canc','Отменить']].map(([k,l])=>`<button data-a="${k}" data-i="${i}"${s.o?' disabled':''}>${l}</button>`).join('')}</div></div>`}
function edHTML(i){const a=state[i].o;return `${a==='edit'?optsHTML('t'+i):''}<textarea id="t${i}" data-kq="t${i}" data-dr="${a}" class="cc-ta-${a}" rows="4" style="width:100%;margin-top:8px;box-sizing:border-box" placeholder="${a==='edit'?'Новое значение':'Контекст для переформулировки'}">${esc(state[i].dr[a]??(a==='edit'?(state[i].e||R[i].n):state[i].c))}</textarea><div class="cc-eb"><button class="cc-ib" data-cancel="${i}" data-tip="Отменить ввод" aria-label="Отменить ввод"><i class="ti ti-x" aria-hidden="true"></i></button><button class="cc-ib" data-save="${a}" data-i="${i}" data-tip="Сохранить" aria-label="Сохранить"><i class="ti ti-check" aria-hidden="true"></i></button></div><div id="err${i}" style="font-size:13px;color:var(--text-danger)"></div>`}
function render(){document.getElementById('rows').innerHTML=R.map(rowHTML).join('')}
function renderRow(i){document.querySelector(`[data-blk="r${i}"]`).outerHTML=rowHTML(R[i],i);if(state[i].o){syncOpts('t'+i);document.getElementById('t'+i).focus()}}
function renderMiss(){const el=document.getElementById('miss');if(!M.length){el.innerHTML='<div style="font-size:14px;color:var(--text-secondary)">Вопросов нет.</div>';return}
el.innerHTML=M.map((m,i)=>{const st=ms[i].st;return `<div class="cc-row ${st==='acc'?'s-macc':st?'s-'+st:''}" data-blk="m${i}"><div class="cc-hd" style="align-items:flex-start"><div style="font-size:14px;line-height:1.5">${qHTML(m)}${st?`<span class="cc-tag" style="background:${MT[st][1]};color:${MT[st][2]}">${MT[st][0]}</span>`:''}</div>${navHTML('m'+i)}</div>
${optsHTML('m'+i)}
<textarea id="m${i}" data-kq="m${i}" rows="2" style="width:100%;margin-top:8px;box-sizing:border-box" placeholder="Ваш ответ"></textarea>
<div id="me${i}" style="font-size:13px;color:var(--text-danger)"></div>
<div class="cc-btns"><button data-mb="acc" data-mi="${i}" aria-pressed="${st==='acc'}">Принять</button><button data-mb="post" data-mi="${i}" aria-pressed="${st==='post'}">Отложить</button><button data-mb="canc" data-mi="${i}" aria-pressed="${st==='canc'}">Отменить</button></div></div>`}).join('');M.forEach((_,j)=>{document.getElementById('m'+j).value=keep[j];syncOpts('m'+j)})}
function qHTML(m){const q=m.q,L=(m.l||[]).filter(x=>x.t&&q.includes(x.t));let o='',i=0;
while(i<q.length){let b=null;L.forEach(x=>{const p=q.indexOf(x.t,i);if(p>=0&&(!b||p<b.p||(p===b.p&&x.t.length>b.x.t.length)))b={p,x}});
if(!b){o+=esc(q.slice(i));break}o+=esc(q.slice(i,b.p))+`<a href="${b.x.u}">${esc(b.x.t)}</a>`;i=b.p+b.x.t.length}return o}
const parts=v=>v.split(';').map(s=>s.trim()).filter(Boolean);
const src=k=>k[0]==='m'?M[+k.slice(1)]:R[+k.slice(1)];
function optsHTML(k){const o=src(k).opts||[];if(!o.length)return'';
return o.length<=6?`<div class="cc-opts">${o.map((x,j)=>`<button data-k="${k}" data-ok="${j}" aria-pressed="false">${esc(x)}</button>`).join('')}</div>`:`<div class="cc-dd"><input type="search" id="s${k}" data-ks="${k}" placeholder="Найти вариант (${o.length})" autocomplete="off"><div class="cc-ddl" id="l${k}" hidden></div></div>`}
function syncOpts(k){const ta=document.getElementById(k);if(!ta)return;const p=parts(ta.value);document.querySelectorAll(`[data-k="${k}"]`).forEach(b=>b.setAttribute('aria-pressed',String(p.includes(src(k).opts[+b.dataset.ok]))))}
function fillList(k){const l=document.getElementById('l'+k),f=document.getElementById('s'+k).value.trim().toLowerCase();
const hits=src(k).opts.map((o,j)=>[o,j]).filter(([o])=>o.toLowerCase().includes(f));
l.innerHTML=hits.length?hits.map(([o,j])=>`<button data-k="${k}" data-ok="${j}" aria-pressed="false">${esc(o)}</button>`).join(''):'<div class="cc-none">Ничего не найдено</div>';l.hidden=false;syncOpts(k)}
function pick(k,j){const ta=document.getElementById(k),q=src(k),o=q.opts[j];let p=parts(ta.value);
if(q.one)p=p.includes(o)?[]:[o];else p=p.includes(o)?p.filter(x=>x!==o):p.concat(o);
ta.value=p.join('; ');ta.dispatchEvent(new Event('input',{bubbles:true}));const s=document.getElementById('s'+k);if(s){s.value='';document.getElementById('l'+k).hidden=true}}
function say(t,bad){const n=document.getElementById('note');n.textContent=t;n.style.color=bad?'var(--text-danger)':'var(--text-secondary)'}
function copyText(t,cb){const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=true;try{document.execCommand('copy')}catch(x){ok=false}ta.remove();cb(ok)};
if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>cb(true),fb)}else fb()}
function pending(){const r=state.filter(s=>!s.a).length,m=ms.filter(x=>!x.st).length;
return r||m?`Пока не по всем значениям и вопросам принято решение. Без решения: блоков значений — ${r}, вопросов — ${m}.`:''}
render();renderMiss();
document.getElementById('rows').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.k||b.dataset.nav)return;
if(b.dataset.cp){const k=b.dataset.cp,j=+k.slice(1),ic=b.firstElementChild;copyText(k[0]==='n'?R[j].n:state[j].e,ok=>{ic.className=ok?'ti ti-check':'ti ti-x';setTimeout(()=>{ic.className='ti ti-copy'},1500)});return}
if(b.dataset.more){const v=document.getElementById('v'+b.dataset.more);v.classList.toggle('clamp');b.textContent=v.classList.contains('clamp')?'Показать полностью':'Свернуть';return}
const i=+b.dataset.i,a=b.dataset.a;
if(b.dataset.cancel){const j=+b.dataset.cancel;state[j].o=null;renderRow(j);return}
if(a==='edit'||a==='disc'){state[i].a=null;state[i].o=a;say('');renderRow(i);return}
if(b.dataset.save){const t=document.getElementById('t'+i).value.trim();if(!t){document.getElementById('err'+i).textContent='Введите текст';return}
if(b.dataset.save==='edit'){state[i].e=t;state[i].a='edit'}else{state[i].c=t;state[i].a='disc'}state[i].o=null;say('');renderRow(i);return}
state[i].a=a;say('');renderRow(i)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.dr)state[+t.id.slice(1)].dr[t.dataset.dr]=t.value;if(t.dataset.kq)syncOpts(t.dataset.kq);if(t.dataset.ks)fillList(t.dataset.ks)});
document.addEventListener('keydown',e=>{const t=e.target;if(!t.dataset||!t.dataset.dr||e.isComposing)return;const i=t.id.slice(1);
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector(`[data-save][data-i="${i}"]`).click()}else if(e.key==='Escape'){e.preventDefault();document.querySelector(`[data-cancel="${i}"]`).click()}});
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset.ks)fillList(t.dataset.ks)});
const blocks=()=>[...document.querySelectorAll('[data-blk]')];
const undec=el=>{const k=el.dataset.blk,j=+k.slice(1);return k[0]==='r'?!state[j].a:!ms[j].st};
function jump(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('cc-flash');setTimeout(()=>el.classList.remove('cc-flash'),1500)}
function sayOk(t){const n=document.getElementById('note');n.textContent=t;n.style.color='var(--text-success)'}
function go(b){const L=blocks(),d=+b.dataset.nav;if(!L.some(undec)){jump(document.getElementById('fin'));sayOk('Решения по всем блокам приняты');return}let x=L.findIndex(el=>el.dataset.blk===b.dataset.from)+d;
for(;x>=0&&x<L.length;x+=d)if(undec(L[x])){jump(L[x]);return}
const tip=b.dataset.tip;b.dataset.tip=d<0?'Выше блоков без решения нет':'Ниже блоков без решения нет';b.classList.add('tip-on');setTimeout(()=>{b.dataset.tip=tip;b.classList.remove('tip-on')},1500)}
document.addEventListener('click',e=>{const nv=e.target.closest('[data-nav]');if(nv){go(nv);return}
if(e.target.closest('#showBtn')){const t=blocks().find(undec);if(t)jump(t);return}
const b=e.target.closest('[data-k]');if(b){pick(b.dataset.k,+b.dataset.ok);return}
if(!e.target.closest('.cc-dd'))document.querySelectorAll('.cc-ddl').forEach(l=>l.hidden=true)});
document.getElementById('miss').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.k)return;
const a=b.dataset.mb;if(!a)return;const i=+b.dataset.mi;
if(a==='acc'&&!document.getElementById('m'+i).value.trim()){document.getElementById('me'+i).textContent='Введите или выберите ответ';return}
M.forEach((_,j)=>keep[j]=document.getElementById('m'+j).value);ms[i].st=a;say('');renderMiss()});
function collect(){const L=[TITLE];
R.forEach((r,i)=>{const s=state[i];let d;if(s.a==='acc')d='принято';else if(s.a==='edit')d='изменено → «'+s.e+'»';else if(s.a==='disc')d='обсудить: '+s.c;else if(s.a==='canc')d='отменено';else if(s.a==='post')d='отложено';else d='без решения';L.push((i+1)+'. '+r.o+' · '+r.f+': '+d)});
if(M.length){L.push('Не хватает:');M.forEach((m,i)=>{const v=document.getElementById('m'+i).value.trim();L.push('— '+m.q+' → '+(ms[i].st==='canc'?'отменено':ms[i].st==='acc'?v:(ms[i].st==='post'?'отложено':'без решения')+(v?' (черновик: '+v+')':'')))})}return L.join('\n')}
function sayPending(p){const n=document.getElementById('note');n.style.color='var(--text-danger)';n.innerHTML=`<span>${p}</span> <button id="showBtn" style="min-height:32px;font-size:12px;margin-left:6px">Показать</button>`}
function flashCp(ok){const m=document.getElementById('cpMsg');m.textContent=ok?'Данные скопированы':'Не удалось скопировать';m.style.color=ok?'var(--text-success)':'var(--text-danger)';clearTimeout(flashCp.t);flashCp.t=setTimeout(()=>{m.textContent=''},2000)}
document.getElementById('copyBtn').onclick=()=>{const p=pending();copyText(collect(),flashCp);if(p)sayPending(p);else say('')};
document.getElementById('sendBtn').onclick=()=>{const p=pending();if(p){sayPending(p);return}sendPrompt(collect())};
</script>
