<!--
Versafy — шаблон карточки изменений. Эталон к «Versafy — регламент ИИ-ассистента», раздел 3 (версия 2.13).
Хранится в репозитории DiamondeX/versafy-assistant; изменения вносятся только через pull request (см. README).
Словесное описание карточки — Google Doc «Описание карточки изменений для использования ИИ-ассистентом в чатах»
(https://docs.google.com/document/d/1zNn8f3B0WeJ4fmjxR5ZI1pMviZTWF2PfKbyk50bEJGs/edit). Его читают, только если
этот файл недоступен; при изменении устройства или поведения карточки он обновляется вместе с эталоном.

КАК ИСПОЛЬЗОВАТЬ
1. Карточка выводится инструментом show_widget (Visualizer). Перед первым вызовом в чате — read_me с модулем interactive.
2. В widget_code передаётся всё, что ниже этого комментария, без самого комментария.
3. Менять можно ТОЛЬКО три константы в начале <script>:
   TITLE — первая строка собранного текста, например «Решения по карточке (лист 2, строки 3–4):».
   R — блоки значений. Поля каждого блока значения:
       o — объект с номером, как в регламенте: «Rebin Said, SolarCentric #278». У объекта, которого ещё нет
           (новая подзадача, новое событие календаря), — его обозначение: «Новая подзадача «Подготовить офер»»;
       u — ссылка на объект (Planfix, Google Doc, календарь). У объекта, которого ещё нет, не указывается;
       f — поле объекта или приравненная к полю запись: «Статус», «Лид-форма», «Новый комментарий»;
       w — было («—» или пустая строка, если значения не было);
       n — станет (переносы строк — \n);
       s — источник;
       ok — необязательно: true, если ассистент уверен в значении не менее чем на 95 %. Такой блок сразу получает
           решение «принято»; пользователь может выбрать другое решение;
       opts, one — необязательно, как у блоков вопросов M: для полей со списком значений (статус, причина закрытия,
           статус тенанта, исполнители) варианты показываются над полем редактирования при нажатии «Изменить».
       Блоки одного объекта (одинаковые o и u) образуют группу. Порядок групп и порядок блоков
       внутри группы задают регламент (раздел 3) и документ «Versafy — поля объектов».
   M — блоки вопросов «Не хватает»:
       o, u — необязательно: объект, к которому относится вопрос, и ссылка на него, как у блоков значений
           (o и u совпадают с ними буква в букву). Вопросы объекта выводятся в его группе после блоков значений,
           под подписью «Не хватает»; в тексте вопроса название этого объекта не повторяется. Объект, по которому
           есть только вопросы, образует свою группу: она встаёт перед группой объекта, который идёт следом
           за ним в M. Вопросы без o образуют последнюю группу без названия;
       q — текст вопроса обычным текстом (весь вопрос ссылкой не делается);
       l — массив ссылок [{t,u}]: t — точный фрагмент текста q (например «Kamlesh Khatiwala #92»),
           u — ссылка на этот объект. Каждый упомянутый в тексте объект — отдельная ссылка; каждое вхождение t в q
           выводится ссылкой. Если фрагменты начинаются в одном месте, берётся более длинный.
           Без упоминаний объектов l не указывается;
       opts — необязательный массив коротких вариантов ответа, если вопрос подразумевает очевидные варианты
           (например ['Да','Нет'] или список статусов). Без очевидных вариантов opts не указывается.
           До 6 вариантов выводятся кнопками, больше 6 — выпадающим списком с поиском по фрагменту.
           Нажатие варианта дописывает его в поле ответа через «; », повторное нажатие убирает его;
       one — true, если ответ может быть только один (статус, причина закрытия): нажатие заменяет ответ.
       s — источник вопроса, как у блоков значений: откуда ассистент взял то, о чём спрашивает (встреча, переписка,
           поле карточки, правило регламента). Выводится только у активного блока, над кнопками решений.
           Не указывается, только если у вопроса нет источника;
       Варианты для полей со списком значений в Planfix берутся из актуального списка Planfix.
       Ответ в поле можно дописать или изменить вручную.
       Пустой массив M — блоков вопросов в карточке нет.
4. Стили, разметку, кнопки, цвета и функцию collect() не менять.
5. Формат собранного текста (кнопки «Скопировать» и «Отправить»):
   TITLE
   N. объект · поле: принято | изменено → «значение» | обсудить: контекст | отложено | отменено | без решения
   Не хватает:
   — объект · вопрос → ответ | отложено | отложено (черновик: текст) | отменено | без решения | без решения (черновик: текст)
   У вопроса без объекта часть «объект · » не выводится. «ответ» — у вопроса нажата «Принять». У вопроса
   с «Отложить» введённый текст передаётся как черновик. Блок с ok: true, решение по которому не меняли, передаётся
   как «принято».
   Блок значения или блок вопроса без решения: пока такие есть, «Отправить» не срабатывает, а «Скопировать»
   копирует текст с пометками «без решения»; обе кнопки выводят сообщение с числом блоков без решения и кнопкой
   «Показать», которая переводит к первому такому блоку. После копирования под кнопкой «Скопировать» на 2 секунды
   появляется «Данные скопированы».
6. Активный блок. Активным может быть не больше одного блока: тот, по которому кликнули, в который перешли
   клавишей Tab или в котором находится фокус ввода. При открытии карточки активного блока нет. Блок перестаёт
   быть активным, когда активным становится другой блок, при клике или тапе вне блоков и по кнопке
   «Минимизировать». Только активный блок имеет собственную рамку и показывает название
   объекта, надписи «Было» и «Станет», источник, варианты ответов, кнопки решений с текстом и стрелки перехода.
   У активного блока значения отметка решения стоит после названия поля. Пустое «было» не выводится, и «станет»
   занимает всю ширину. При наведении на «Было», «Станет» или «Изменено на» в строке надписи появляется кнопка
   «Копировать» для этого значения.
7. Неактивный блок значения — строка без рамки внутри рамки группы. Способ показа зависит от длины:
   название поля, старое и новое значение вместе не длиннее 100 знаков — одна строка «поле: старое ➜ новое»;
   длиннее, но старое и новое вместе не длиннее 100 знаков — название поля отдельной строкой, под ним
   «старое ➜ новое»; иначе, а также если в значении есть перенос строки, — название поля, под ним старое и новое
   по половине ширины со стрелкой между ними (на узком экране одно под другим). Стрелка «➜» стоит и перед новым
   значением без старого. Длинное значение обрезается до трёх строк со ссылкой «Показать полностью» в самом тексте;
   нажатие раскрывает значение, «Свернуть» сворачивает его обратно. Эти нажатия не делают блок активным
   и не снимают активность; раскрытое значение остаётся раскрытым и в активном, и в неактивном виде блока.
   Решения «принято», «изменено» и «отменено» показываются оформлением нового значения в цвете решения
   (отменённое зачёркнуто), при «изменено» на месте нового значения стоит изменённое. «Обсудить» и «отложено»
   показываются отметкой; у «обсудить» под строкой серым выводится контекст.
8. Всплывающий ряд. При наведении на неактивный блок над ним справа появляется тулбар кнопок-значков
   с подсказками:
   у блока значения — «Принять», «Изменить», «Обсудить», «Отложить», «Отменить», затем «Скопировать старое
   значение» (если оно есть) ➜ «Скопировать новое значение»; у блока вопроса — «Принять», «Отложить», «Отменить».
   «Принять», «Отложить», «Отменить» и копирование срабатывают без активации блока; «Изменить» и «Обсудить»
   делают блок активным и открывают поле ввода. «Скопировать новое значение» копирует то, что показано:
   при решении «изменено» — изменённое значение.
   На широком экране тулбар блока значения стоит левее тулбара группы и не закрывает его; на узком экране
   (мобильная вёрстка) он выровнен по правому краю без смещения и может перекрывать тулбар группы.
9. Группы. У одного объекта одна группа в общей рамке: заголовок с названием объекта, блоки значений,
   затем под подписью «Не хватает» блоки вопросов этого объекта. В заголовке справа тулбар из четырёх
   кнопок-значков с подсказками; кнопки действуют и на блоки значений, и на блоки вопросов группы.
   «Принять все нерешённые» (зелёная галочка) ставит «принято» блокам группы, у которых ещё нет решения;
   уже принятые решения не меняются. «Принять все» (зелёная галочка), «Отложить все» (серые часы) и «Отменить
   все» (красный крестик) ставят своё решение всем блокам группы, в том числе тем, по которым решение уже
   принято; на значке каждой из этих трёх кнопок в углу стоит небольшой плюс. «Принять все» у блока с решением
   «изменено» принимает исходное «Станет». «Принять все нерешённые» и «Принять все» не действуют на блоки
   вопросов, в которых ещё нет ответа. У группы вопросов без объекта заголовок состоит только из тулбара.
   Название объекта в заголовке без ссылки выводится цветом ссылки без подчёркивания.
10. У блоков вопросов кнопки «Принять», «Отложить», «Отменить». Отметка меняется только нажатием другой кнопки;
   «Принять» без ответа не срабатывает. У неактивного вопроса поле ответа занимает одну строку; если ответ
   введён, он выводится без рамки поля.
11. Текст, сохранённый по «Изменить» или «Обсудить», выводится в активном блоке под частями «Было» и «Станет»
   («Изменено на», «Контекст для обсуждения»); «Станет» хранит исходное предложение. После «Изменить» кнопка
   «Принять» принимает исходное «Станет». Текст, введённый в поле «Изменить» или «Обсудить», сохраняется и при
   выборе другого действия и восстанавливается при повторном выборе того же действия. В собранный текст он
   попадает, только если сохранён кнопкой «Сохранить» и итоговое решение по блоку — то же действие. Нажатие
   «Изменить» или «Обсудить» сбрасывает решение по блоку; пока не нажата «Сохранить», поле ввода подсвечено
   цветом режима (синим у «Изменить», жёлто-коричневым у «Обсудить»). Под полем справа тулбар из двух кнопок-значков
   с подсказками: «Отменить ввод» (крестик) закрывает поле, блок остаётся без решения, черновик сохраняется;
   «Сохранить» (галочка). Пока поле открыто, кнопки решений этого блока неактивны (атрибут disabled).
   В поле Enter равносилен «Сохранить», Escape — «Отменить ввод»; перенос строки — Shift+Enter.
   Если блок перестаёт быть активным при открытом поле ввода, сначала происходит то же, что по «Отменить ввод».
12. У активного блока справа вверху тулбар из трёх кнопок-значков с подсказками: стрелки вверх и вниз
   переводят к предыдущему или следующему блоку без решения и делают его активным; «Минимизировать» делает
   блок неактивным. Если решения приняты по всем блокам, стрелки прокручивают
   к кнопкам «Скопировать» и «Отправить», под которыми выводится «Решения по всем блокам приняты».
13. Кнопки-значки и тулбары. Кнопка, на которой есть только значок (кнопки всплывающего ряда, стрелки перехода
   и «Минимизировать», кнопки заголовка группы, «Копировать» у значения, «Отменить ввод» и «Сохранить»), имеет
   размер 30×30 пикселей, рамки у неё нет (border: 0), значок занимает на ней 22×22 пикселя. Фон кнопки —
   едва заметный полупрозрачный чёрный (в тёмной теме белый), при наведении он становится чуть плотнее.
   Группа кнопок-значков называется тулбаром: у него общая рамка, а между кнопками и от кнопок до рамки
   тулбара — по 4 пикселя. Одиночная кнопка-значок («Копировать») стоит без тулбара.
   Плюс в углу значка означает, что кнопка действует на все блоки группы независимо от принятых решений.
-->
<h2 class="sr-only">Карточка предлагаемых изменений</h2>

const i=+b.dataset.i,a=b.dataset.a,tb=b.dataset.tb!==undefined;
if(b.dataset.cancel){const j=+b.dataset.cancel,o=state[j].o;state[j].o=null;renderRow(j,o);return}
if(a==='edit'||a==='disc'){state[i].a=null;state[i].o=a;say('');renderRow(i);return}
if(b.dataset.save){const t=document.getElementById('t'+i).value.trim();if(!t){document.getElementById('err'+i).textContent='Введите текст';return}
if(b.dataset.save==='edit'){state[i].e=t;state[i].a='edit'}else{state[i].c=t;state[i].a='disc'}state[i].o=null;say('');renderRow(i,b.dataset.save);return}
state[i].a=a;say('');renderRow(i,tb?null:a)});
document.addEventListener('input',e=>{const t=e.target;if(/^m\d+$/.test(t.id))sizeM(+t.id.slice(1));if(t.dataset.dr)state[+t.id.slice(1)].dr[t.dataset.dr]=t.value;if(t.dataset.kq)syncOpts(t.dataset.kq);if(t.dataset.ks)fillList(t.dataset.ks)});
document.addEventListener('keydown',e=>{const t=e.target;if(!t.dataset||!t.dataset.dr||e.isComposing)return;const i=t.id.slice(1);
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector(`[data-save][data-i="${i}"]`).click()}else if(e.key==='Escape'){e.preventDefault();document.querySelector(`[data-cancel="${i}"]`).click()}});
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset.ks)fillList(t.dataset.ks)});
document.addEventListener('pointerdown',()=>{down=true},true);
document.addEventListener('pointercancel',()=>{down=false},true);
document.addEventListener('pointerup',e=>{down=false;const t=e.target;if(e.pointerType==='touch'&&act&&!blkOf(t)&&!(t&&t.closest&&t.closest('button,a,input,textarea,[role="button"]')))setAct(null)},true);
window.addEventListener('blur',()=>{down=false});
const noAct=t=>!!(t&&t.closest&&t.closest('[data-na]'));
document.addEventListener('click',e=>{if(noAct(e.target))return;setAct(blkOf(e.target))},true);
document.addEventListener('keydown',e=>{down=false;const t=e.target,k=blkOf(t);if(k&&!noAct(t))setAct(k);if(t.dataset&&t.dataset.more&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.click()}},true);
document.addEventListener('focusin',e=>{const k=blkOf(e.target);if(k&&!down&&!noAct(e.target))setAct(k)});
function enter(el){if(el.dataset.blk){setAct(el.dataset.blk);el.focus({preventScroll:true})}jump(el)}
const blocks=()=>[...document.querySelectorAll('[data-blk]')];
const undec=el=>{const k=el.dataset.blk,j=+k.slice(1);return k[0]==='r'?!state[j].a:!ms[j].st};
function jump(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('cc-flash');setTimeout(()=>el.classList.remove('cc-flash'),1500)}
function sayOk(t){const n=document.getElementById('note');n.textContent=t;n.style.color='var(--text-success)'}
function go(b){const L=blocks(),d=+b.dataset.nav;if(!L.some(undec)){jump(document.getElementById('fin'));sayOk('Решения по всем блокам приняты');return}let x=L.findIndex(el=>el.dataset.blk===b.dataset.from)+d;
for(;x>=0&&x<L.length;x+=d)if(undec(L[x])){enter(L[x]);return}
const tip=b.dataset.tip;b.dataset.tip=d<0?'Выше блоков без решения нет':'Ниже блоков без решения нет';b.classList.add('tip-on');setTimeout(()=>{b.dataset.tip=tip;b.classList.remove('tip-on')},1500)}
document.addEventListener('click',e=>{const nv=e.target.closest('[data-nav]');if(nv){go(nv);return}
if(e.target.closest('[data-min]')){setAct(null);if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();return}
const al=e.target.closest('[data-all]');if(al){const a=al.dataset.all,f=al.dataset.force!==undefined,g=al.closest('.cc-grp');g.querySelectorAll('[data-blk^="r"]').forEach(x=>{const j=+x.dataset.blk.slice(1),s=state[j];if(f?(s.a!==a||s.o):(!s.a&&!s.o)){s.o=null;s.a=a;renderRow(j)}});
const q=[...g.querySelectorAll('[data-blk^="m"]')].map(x=>+x.dataset.blk.slice(1));if(q.length){M.forEach((_,j)=>keep[j]=document.getElementById('m'+j).value);let ch=0;q.forEach(j=>{if((f||!ms[j].st)&&ms[j].st!==a&&(a!=='acc'||keep[j].trim())){ms[j].st=a;ch=1}});if(ch)renderMiss()}say('');return}
if(e.target.closest('#showBtn')){const t=blocks().find(undec);if(t)enter(t);return}
const b=e.target.closest('[data-k]');if(b){pick(b.dataset.k,+b.dataset.ok);return}
if(!e.target.closest('.cc-dd'))document.querySelectorAll('.cc-ddl').forEach(l=>l.hidden=true)});
document.getElementById('rows').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.k)return;
const a=b.dataset.mb;if(!a)return;const i=+b.dataset.mi;
if(a==='acc'&&!document.getElementById('m'+i).value.trim()){document.getElementById('me'+i).textContent='Введите или выберите ответ';return}
M.forEach((_,j)=>keep[j]=document.getElementById('m'+j).value);ms[i].st=a;say('');renderMiss();if(b.dataset.tb===undefined)refocus(`.cc-btns [data-mb="${a}"][data-mi="${i}"]`)});
function collect(){const L=[TITLE];
R.forEach((r,i)=>{const s=state[i];let d;if(s.a==='acc')d='принято';else if(s.a==='edit')d='изменено → «'+s.e+'»';else if(s.a==='disc')d='обсудить: '+s.c;else if(s.a==='canc')d='отменено';else if(s.a==='post')d='отложено';else d='без решения';L.push((i+1)+'. '+r.o+' · '+r.f+': '+d)});
if(M.length){L.push('Не хватает:');M.forEach((m,i)=>{const v=document.getElementById('m'+i).value.trim();L.push('— '+(m.o?m.o+' · ':'')+m.q+' → '+(ms[i].st==='canc'?'отменено':ms[i].st==='acc'?v:(ms[i].st==='post'?'отложено':'без решения')+(v?' (черновик: '+v+')':'')))})}return L.join('\n')}
function sayPending(p){const n=document.getElementById('note');n.style.color='var(--text-danger)';n.innerHTML=`<span>${p}</span> <button id="showBtn" style="min-height:32px;font-size:12px;margin-left:6px">Показать</button>`}
function flashCp(ok){const m=document.getElementById('cpMsg');m.textContent=ok?'Данные скопированы':'Не удалось скопировать';m.style.color=ok?'var(--text-success)':'var(--text-danger)';clearTimeout(flashCp.t);flashCp.t=setTimeout(()=>{m.textContent=''},2000)}
document.getElementById('copyBtn').onclick=()=>{const p=pending();copyText(collect(),flashCp);if(p)sayPending(p);else say('')};
document.getElementById('sendBtn').onclick=()=>{const p=pending();if(p){sayPending(p);return}sendPrompt(collect())};
</script>
